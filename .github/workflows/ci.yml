name: Validate game
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run simulate -- --runs 10 --output docs/reports/ci-balance.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
